    <div id="app-container" class="w-full max-w-lg mx-auto">

            <p class="text-gray-500 mb-8">請選擇測驗題庫</p>
            <div id="bank-selection" class="space-y-4">
                <button onclick="selectBank('bank1')" class="btn btn-bank">多益核心(一)：求職與規範 (15題)</button>

            <div id="mode-selection" class="mt-8 space-y-4 hidden">

                <button onclick="startQuiz('multiple-choice')" class="btn btn-primary">選擇題模式</button>
                <button onclick="startQuiz('fill-in-the-blank')" class="btn btn-primary">英翻中模式</button>
            </div>
        </div>

        <div id="quiz-screen" class="card hidden">
            <div class="flex justify-between items-center mb-6">
                <p id="progress-text" class="text-sm font-medium text-gray-500"></p>
                <p id="score-text" class="text-sm font-medium text-gray-500">分數: 0</p>
            </div>
            
            <div class="text-center mb-8">
                <h2 id="question-word" class="text-5xl font-bold text-indigo-600 mb-2" lang="en"></h2>
                <p id="part-of-speech" class="text-gray-500"></p>
            </div>

            <div id="multiple-choice-options" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            </div>

            <div id="fill-in-the-blank-input" class="mb-6 hidden">
                <input type="text" id="answer-input" placeholder="請輸入中文意思..." class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                <button id="submit-fill-in" class="btn btn-primary mt-4">送出答案</button>
            </div>

            <div id="feedback-message" class="text-center font-bold my-4 h-6"></div>

            <button id="next-btn" class="btn btn-secondary hidden">下一題</button>
        </div>

        <div id="results-screen" class="card hidden text-center">

            <p id="final-score" class="text-6xl font-bold text-indigo-600 mb-8"></p>

                <button onclick="goToMenu()" class="btn btn-secondary">返回主選單</button>

                { english: "rest", chinese: ["休息"], pos: "v." }, { english: "exhibition", chinese: ["展覽"], pos: "n." }, { english: "celebrity", chinese: ["名人"], pos: "n." }, { english: "live", chinese: ["直播的"], pos: "adj." }, { english: "improvise", chinese: ["即興演奏"], pos: "v." }, { english: "popular", chinese: ["受歡迎的"], pos: "adj." }, { english: "donation", chinese: ["捐贈", "捐獻"], pos: "n." }, { english: "alumni", chinese: ["校友們", "畢業生們"], pos: "n." }, { english: "present", chinese: ["提示", "出示"], pos: "v." }, { english: "admission", chinese: ["入場"], pos: "n." }, { english: "banquet", chinese: ["宴會"], pos: "n." }, { english: "anniversary", chinese: ["周年紀念日"], pos: "n." }, { english: "required", chinese: ["必要的", "必須的"], pos: "adj." }, { english: "succeed", chinese: ["成功", "繼任"], pos: "v." }, { english: "collection", chinese: ["收藏品", "收取"], pos: "n." }, { english: "fund-raising", chinese: ["募款"], pos: "n." }, { english: "resume", chinese: ["繼續", "重新開始"], pos: "v." }, { english: "issue", chinese: ["一期", "問題"], pos: "n." }, { english: "subscription", chinese: ["訂閱"], pos: "n." }, { english: "appear", chinese: ["出現", "現身"], pos: "v." }, { english: "accompany", chinese: ["陪同", "伴隨"], pos: "v." }, { english: "edition", chinese: ["版本"], pos: "n." }, { english: "specifically", chinese: ["明確地", "具體地"], pos: "adv." }, { english: "anonymous", chinese: ["匿名的", "不具名的"], pos: "adj." }, { english: "commit", chinese: ["奉獻", "致力於"], pos: "v." }, { english: "informative", chinese: ["提供資訊的", "有用的"], pos: "adj." }, { english: "audience", chinese: ["聽眾", "觀眾"], pos: "n." }, { english: "author", chinese: ["作家", "作者"], pos: "n." }, { english: "note", chinese: ["注意到", "提及"], pos: "v." }, { english: "antique", chinese: ["古董"], pos: "n." }, { english: "manuscript", chinese: ["手稿", "原稿"], pos: "n." }, { english: "beneficial", chinese: ["有益的", "有利的"], pos: "adj." }, { english: "upcoming", chinese: ["即將來臨的"], pos: "adj." }, { english: "lend", chinese: ["借出"], pos: "v." }, { english: "current", chinese: ["現在的", "目前的"], pos: "adj." }, { english: "local", chinese: ["地方的", "當地的"], pos: "adj." }, { english: "variety", chinese: ["多樣性", "變化"], pos: "n." }, { english: "advocate", chinese: ["擁護者"], pos: "n." }, { english: "contributor", chinese: ["撰稿人", "捐贈者"], pos: "n." }, { english: "defy", chinese: ["反抗"], pos: "v." }, { english: "fascinating", chinese: ["迷人的", "美妙的"], pos: "adj." }, { english: "showing", chinese: ["上映", "展示"], pos: "n." },
            ]
        };
        
        wordBanks.bank_all = [...wordBanks.bank1, ...wordBanks.bank2, ...wordBanks.bank3, ...wordBanks.bank4, ...wordBanks.bank5, ...wordBanks.bank6];

        // DOM Elements
        const homeScreen = document.getElementById('home-screen');
        const modeSelection = document.getElementById('mode-selection');
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const progressText = document.getElementById('progress-text');
        const scoreText = document.getElementById('score-text');
        const questionWord = document.getElementById('question-word');
        const partOfSpeech = document.getElementById('part-of-speech');
        const multipleChoiceOptions = document.getElementById('multiple-choice-options');
        const fillInTheBlankInput = document.getElementById('fill-in-the-blank-input');
        const answerInput = document.getElementById('answer-input');
        const submitFillInBtn = document.getElementById('submit-fill-in');
        const feedbackMessage = document.getElementById('feedback-message');
        const nextBtn = document.getElementById('next-btn');
        const finalScore = document.getElementById('final-score');

        // State Variables
        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let quizMode = '';
        let selectedBank = '';
        let quizLength = 0;
        
        // Wrong Answer Review System
        let wrongAnswersReviewPool = [];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function selectBank(bankName) {
            selectedBank = bankName;
            modeSelection.classList.remove('hidden');
        }

        function startQuiz(mode) {
            if (!selectedBank) {
                alert("請先選擇一個題庫！");
                return;
            }
            quizMode = mode;
            currentQuestionIndex = 0;
            score = 0;
            
            const baseLength = (selectedBank === 'bank_all') ? 30 : 15;
            
            // --- Upgraded Wrong Answer Injection Logic ---
            const mainVocabulary = [...wordBanks[selectedBank]];
            shuffle(wrongAnswersReviewPool);

            const numReviewQuestions = Math.min(5, wrongAnswersReviewPool.length);
            quizLength = baseLength + numReviewQuestions; // Total length is base + review questions
            
            // Get review questions and flag them
            const reviewQuestions = wrongAnswersReviewPool
                .slice(0, numReviewQuestions)
                .map(q => ({ ...q, isReview: true }));
            
            // Filter out review questions from the main pool to avoid duplicates
            const newQuestionsPool = mainVocabulary.filter(word => 
                !reviewQuestions.some(reviewWord => reviewWord.english === word.english)
            );

            const newQuestions = shuffle(newQuestionsPool).slice(0, baseLength);

            // Combine and shuffle the final quiz
            currentQuiz = shuffle([...reviewQuestions, ...newQuestions]);
            
            homeScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            resetQuestionUI();
            if (currentQuestionIndex >= currentQuiz.length) {
                showResults();
                return;
            }
            const question = currentQuiz[currentQuestionIndex];
            
            // Display progress with review tag if applicable
            const isReview = question.isReview;
            progressText.innerHTML = `問題 ${currentQuestionIndex + 1} / ${quizLength} ${isReview ? '<span class="text-amber-500 font-bold ml-2">(錯題複習)</span>' : ''}`;

            scoreText.textContent = `分數: ${score}`;
            questionWord.textContent = question.english;
            partOfSpeech.textContent = question.pos;

            if (quizMode === 'multiple-choice') {
                fillInTheBlankInput.classList.add('hidden');
                multipleChoiceOptions.classList.remove('hidden');
                setupMultipleChoice(question);
            } else {
                multipleChoiceOptions.classList.add('hidden');
                fillInTheBlankInput.classList.remove('hidden');
            }
        }
        
        function addWrongAnswerToPool() {
            const question = currentQuiz[currentQuestionIndex];
            // Remove the 'isReview' flag before adding to the pool
            const originalQuestion = { ...question };
            delete originalQuestion.isReview;
            
            if (!wrongAnswersReviewPool.some(w => w.english === originalQuestion.english)) {
                wrongAnswersReviewPool.push(originalQuestion);
            }
        }

        function setupMultipleChoice(correctQuestion) {
            const currentBank = wordBanks[selectedBank];
            const correctPos = correctQuestion.pos.split('/')[0];
            
            let distractorsPool = currentBank.filter(word => 
                word.english !== correctQuestion.english && word.pos.includes(correctPos)
            );

            if (distractorsPool.length < 3) {
                 const fallbackPool = currentBank.filter(word => word.english !== correctQuestion.english);
                 distractorsPool = [...new Set([...distractorsPool, ...fallbackPool])];
            }

            shuffle(distractorsPool);

            const correctAnswerText = correctQuestion.chinese.join(' / ');
            const options = [correctAnswerText];
            
            const wrongAnswers = distractorsPool.slice(0, 3).map(word => word.chinese.join(' / '));
            options.push(...wrongAnswers);

            while (options.length < 4) { options.push("其他選項"); }
            
            shuffle(options);
            
            multipleChoiceOptions.innerHTML = '';
            options.forEach(optionText => {
                const button = document.createElement('button');
                button.className = 'btn option-btn';
                button.textContent = optionText;
                button.onclick = () => checkMultipleChoiceAnswer(optionText, correctQuestion, button);
                multipleChoiceOptions.appendChild(button);
            });
        }
        
        function handleAnswer(isCorrect, correctAnswerText = '') {
            if (isCorrect) {
                score++;
                feedbackMessage.textContent = '答對了！';
                feedbackMessage.className = 'text-center font-bold my-4 h-6 text-green-600';
            } else {
                feedbackMessage.textContent = `答錯了！答案是: ${correctAnswerText}`;
                feedbackMessage.className = 'text-center font-bold my-4 h-6 text-red-600';
                addWrongAnswerToPool();
            }
            scoreText.textContent = `分數: ${score}`;
            nextBtn.classList.remove('hidden');
        }

        function checkMultipleChoiceAnswer(selectedAnswerText, correctQuestion, button) {
            const buttons = multipleChoiceOptions.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);
            
            const correctAnswerText = correctQuestion.chinese.join(' / ');
            const isCorrect = (selectedAnswerText === correctAnswerText);
            
            if (isCorrect) {
                button.classList.add('correct');
            } else {
                button.classList.add('incorrect');
                buttons.forEach(btn => {
                    if (btn.textContent === correctAnswerText) btn.classList.add('correct');
                });
            }
            handleAnswer(isCorrect, correctAnswerText);
        }
        
        function checkFillInAnswer() {
            const userAnswer = answerInput.value.trim();
            if (!userAnswer) return;
            
            const question = currentQuiz[currentQuestionIndex];
            const correctAnswers = question.chinese;
            const isCorrect = correctAnswers.some(correct => userAnswer.includes(correct) || correct.includes(userAnswer));
            
            submitFillInBtn.disabled = true;
            answerInput.disabled = true;
            answerInput.classList.add(isCorrect ? 'correct' : 'incorrect');

            handleAnswer(isCorrect, correctAnswers.join(' / '));
        }

        submitFillInBtn.onclick = checkFillInAnswer;
        answerInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !submitFillInBtn.disabled) {
                event.preventDefault(); 
                checkFillInAnswer();
            }
        });

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            loadQuestion();
        };

        function resetQuestionUI() {
            feedbackMessage.textContent = '';
            feedbackMessage.className = 'text-center font-bold my-4 h-6';
            nextBtn.classList.add('hidden');
            multipleChoiceOptions.innerHTML = '';
            answerInput.value = '';
            answerInput.className = 'w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition';
            answerInput.disabled = false;
            submitFillInBtn.disabled = false;
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            finalScore.textContent = `${score} / ${quizLength}`;
        }

        function restartQuiz() {
            startQuiz(quizMode); 
        }

        function goToMenu() {
            resultsScreen.classList.add('hidden');
            modeSelection.classList.add('hidden'); 
            homeScreen.classList.remove('hidden');
            selectedBank = ''; 
        }

        // --- PWA Service Worker Registration ---
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                // Define the scope path here, outside of the template literal
                const SCOPE_PATH = '/vocab-quiz-pwa/';
                const swCode = `
                    const CACHE_NAME = 'vocab-quiz-pwa-v6';
                    // These variables are now hardcoded with the value from the outer scope
                    const urlsToCache = [
                        '${SCOPE_PATH}',
                        '${SCOPE_PATH}index.html',
                        '${SCOPE_PATH}icons/icon-192x192.png',
                        '${SCOPE_PATH}icons/icon-512x512.png'
                    ];

                    self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(urlsToCache))));
                    self.addEventListener('activate', e => e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => k !== CACHE_NAME ? caches.delete(k) : null))).then(() => self.clients.claim())));
                    self.addEventListener('fetch', e => {
                        if (e.request.mode === 'navigate') {
                            e.respondWith(caches.match(e.request).then(res => res || fetch(e.request).catch(() => caches.match('${SCOPE_PATH}index.html'))));
                            return;
                        }
                        e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('ServiceWorker registration successful.'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            registerServiceWorker();
        });

    </script>
</body>
