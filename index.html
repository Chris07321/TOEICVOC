    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050505;
            color: #e2e8f0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
        .font-academic { font-family: "Times New Roman", Times, serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #0891b2; border-radius: 3px; }
        
        /* Cyber Grid Background */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* Shake Animation */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .animate-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>

        // --- 2. DATA & CONSTANTS ---

        const WORD_BANKS = {

              { english: "opening", chinese: ["空缺", "職缺"], pos: "n." },

        const allWords = Object.values(WORD_BANKS).flatMap(b => b.words);
        WORD_BANKS['bank_all'] = { 
            id: 'bank_all', icon: 'Cpu', title: 'NETRUN (ALL)', 
            words: allWords 
        };

        const ACHIEVEMENTS = [
          { id: 'first_blood', icon: <Icons.Zap className="text-yellow-400" />, title: 'Initialize', desc: 'Complete your first protocol (quiz).', maxProgress: 1, check: (d) => d.quizzesCompleted },

          { id: 'perfect_one', icon: <Icons.CheckCircle className="text-emerald-400" />, title: 'Precision Strike', desc: 'Achieve 100% accuracy in any sector.', maxProgress: 1, check: (d) => d.perfectBanks.length },

        ];

        const LOCAL_STORAGE_KEY = 'cyber_vocab_user_v2';

        // --- 3. UTILS & SERVICE (LOCAL ONLY) ---
        function shuffleArray(array) {
          const newArr = [...array];
          for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
          }
          return newArr;
        }

        const getLocalDistractors = (targetWord, bankWords) => {
          const combinedPool = [...bankWords, ...FILLER_WORDS].filter(w => w.english.toLowerCase() !== targetWord.english.toLowerCase());
          const samePos = combinedPool.filter(w => w.pos.substring(0, 2) === targetWord.pos.substring(0, 2));
          let selected = [];
          if (samePos.length >= 5) {
            selected = shuffleArray(samePos).slice(0, 3);
          } else {
            const remaining = shuffleArray(combinedPool).slice(0, 3);
            selected = remaining;
          }
          return selected;
        };

        // --- 4. COMPONENTS ---
        const TechCard = ({ children, className = '', onClick, isSelected, isCorrect, isWrong }) => {
            let borderColor = "border-cyan-900/30";
            let bgColor = "bg-[#0a0f1c]/90";
            let shadow = "";
            let scale = 1;

            if (isSelected) {
                borderColor = "border-cyan-400";
                bgColor = "bg-cyan-950/40";
                shadow = "shadow-[0_0_20px_rgba(6,182,212,0.2)]";
                scale = 1.02;
            }
            if (isCorrect) {
                borderColor = "border-emerald-400";
                bgColor = "bg-emerald-950/40";
                shadow = "shadow-[0_0_20px_rgba(16,185,129,0.3)]";
                scale = 1.02;
            }
            if (isWrong) {
                borderColor = "border-red-500";
                bgColor = "bg-red-950/40";
                shadow = "shadow-[0_0_20px_rgba(239,68,68,0.2)]";
                scale = 0.98;
            }

            return (
                <motion.div 
                  onClick={onClick}
                  animate={{ scale }}
                  className={`relative backdrop-blur-md border ${borderColor} ${bgColor} rounded-xl overflow-hidden transition-colors duration-300 ${shadow} ${onClick ? 'cursor-pointer hover:border-cyan-500/50' : ''} ${className}`}
                >
                  <div className={`absolute top-0 left-0 w-2 h-2 border-l-2 border-t-2 ${isCorrect ? 'border-emerald-500' : 'border-cyan-500/30'} rounded-tl-sm`}></div>
                  <div className={`absolute top-0 right-0 w-2 h-2 border-r-2 border-t-2 ${isCorrect ? 'border-emerald-500' : 'border-cyan-500/30'} rounded-tr-sm`}></div>
                  <div className={`absolute bottom-0 left-0 w-2 h-2 border-l-2 border-b-2 ${isCorrect ? 'border-emerald-500' : 'border-cyan-500/30'} rounded-bl-sm`}></div>
                  <div className={`absolute bottom-0 right-0 w-2 h-2 border-r-2 border-b-2 ${isCorrect ? 'border-emerald-500' : 'border-cyan-500/30'} rounded-br-sm`}></div>
                  {children}
                </motion.div>
            );
        };

        const TechButton = ({ children, variant = 'primary', className = '', ...props }) => {
            const variants = {
                primary: "bg-gradient-to-r from-cyan-700 to-blue-700 hover:from-cyan-600 hover:to-blue-600 text-white border-cyan-500/50",

                danger: "bg-gradient-to-r from-red-700 to-orange-800 hover:from-red-600 hover:to-orange-700 text-white border-red-500/50",
                success: "bg-gradient-to-r from-emerald-600 to-green-700 hover:from-emerald-500 hover:to-green-600 text-white border-emerald-400/50"
            };
            return (
                <motion.button
                  whileTap={{ scale: 0.95 }}
                  className={`w-full py-4 px-6 rounded-xl font-cyber font-bold tracking-wider uppercase text-sm md:text-base border border-b-4 active:border-b active:translate-y-0.5 transition-all shadow-lg flex justify-center items-center gap-2 ${variants[variant]} ${props.disabled ? 'opacity-50 cursor-not-allowed grayscale' : ''} ${className}`}
                  {...props}
                >
                  {children}
                </motion.button>
            );

        const TechInput = ({ className = '', ...props }) => (
            <div className="relative w-full">
                <input className={`w-full bg-[#0a0f1c] border-2 border-slate-700 rounded-xl px-5 py-4 text-slate-100 font-bold text-lg focus:outline-none focus:border-cyan-500 focus:shadow-[0_0_15px_rgba(6,182,212,0.3)] placeholder:text-slate-600 transition-all ${className}`} {...props} />
                <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                    <div className="w-2 h-4 bg-cyan-500/50 animate-pulse"></div>
                </div>
            </div>
        );

        const ProgressBar = ({ current, total, color = "from-cyan-500 to-blue-600" }) => {
            const percent = Math.min(100, Math.max(0, (current / total) * 100));
            return (
                <div className="w-full h-2.5 bg-slate-800/80 rounded-full overflow-hidden border border-slate-700 relative">
                    <motion.div 
                        className={`h-full bg-gradient-to-r ${color} shadow-[0_0_10px_rgba(6,182,212,0.5)]`}
                        initial={{ width: 0 }}
                        animate={{ width: `${percent}%` }}
                        transition={{ duration: 0.5 }}
                    />
                </div>
            );
        };

        const Layout = ({ children }) => (
            <div className="min-h-screen w-full bg-[#050505] text-slate-200 relative overflow-hidden flex flex-col">
                <div className="absolute inset-0 pointer-events-none">
                    <div className="absolute inset-0 cyber-grid opacity-30"></div>
                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-cyan-500/10 blur-[100px] rounded-full"></div>
                    <div className="absolute bottom-0 right-0 w-[600px] h-[400px] bg-purple-600/10 blur-[100px] rounded-full"></div>
                </div>
                <div className="relative z-10 flex-grow flex flex-col max-w-md mx-auto w-full h-full">
                    {children}
                </div>
            </div>
        );

        // --- 5. MAIN APP LOGIC ---
        const initialUserData = {
          totalCorrect: 0,
          quizzesCompleted: 0,
          playedBanks: [],
          perfectBanks: [],
          unlockedAchievements: [],
          maxCombo: 0
        };

        const App = () => {
          const [userData, setUserData] = useState(initialUserData);
          const [appState, setAppState] = useState('home');
          
          // Quiz State
          const [currentBankId, setCurrentBankId] = useState('');
          const [gameMode, setGameMode] = useState('multiple-choice');
          const [quizQuestions, setQuizQuestions] = useState([]);
          const [currentQIndex, setCurrentQIndex] = useState(0);
          const [score, setScore] = useState(0);
          const [combo, setCombo] = useState(0);
          const [maxComboSession, setMaxComboSession] = useState(0);
          
          const [selectedOption, setSelectedOption] = useState(null);
          const [textInput, setTextInput] = useState('');
          const [isAnswered, setIsAnswered] = useState(false);
          const [isCorrect, setIsCorrect] = useState(false);
          const [quizLoading, setQuizLoading] = useState(false);
          const [feedbackMessage, setFeedbackMessage] = useState('');
          const [shake, setShake] = useState(false);
          
          // Modals
          const [showAchievements, setShowAchievements] = useState(false);
          const [showModeSelect, setShowModeSelect] = useState(false);
          const [pendingBankId, setPendingBankId] = useState(null);

          useEffect(() => {
            const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (saved) {
              setUserData({ ...initialUserData, ...JSON.parse(saved) });
            }
          }, []);

          useEffect(() => {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userData));
          }, [userData]);

          const handleBankClick = (bankId) => {
            setPendingBankId(bankId);
            setShowModeSelect(true);
          };

          const confirmStartQuiz = (mode) => {
            if (!pendingBankId) return;
            setShowModeSelect(false);
            startQuiz(pendingBankId, mode);
          };

          const startQuiz = (bankId, mode) => {
            setQuizLoading(true);
            setCurrentBankId(bankId);
            setGameMode(mode);
            setScore(0);
            setCombo(0);
            setMaxComboSession(0);
            setCurrentQIndex(0);
            setIsAnswered(false);
            setSelectedOption(null);
            setTextInput('');

            const bank = WORD_BANKS[bankId];
            const deckSize = bankId === 'bank_all' ? 30 : 15;
            const shuffledWords = [...bank.words].sort(() => 0.5 - Math.random()).slice(0, deckSize);
            
            // Prepare questions
            const questions = shuffledWords.map(w => ({ ...w, options: [] }));

            if (mode === 'multiple-choice') {
                const bankWords = bank.words;
                questions.forEach(q => {
                    const distractors = getLocalDistractors(q, bankWords);
                    q.options = [q, ...distractors].sort(() => 0.5 - Math.random());
                });
            }

            setQuizQuestions(questions);
            
            // Fake loading for effect
            setTimeout(() => {
                setQuizLoading(false);
                setAppState('quiz');
            }, 600);
          };

          const handleOptionSelect = (index) => {
            if (isAnswered) return;
            setSelectedOption(index);
          };

          const checkAnswer = () => {
            if (gameMode === 'multiple-choice' && selectedOption === null) return;
            if (gameMode === 'fill-in-the-blank' && !textInput.trim()) return;
            
            const currentQ = quizQuestions[currentQIndex];
            let correct = false;

            if (gameMode === 'multiple-choice' && selectedOption !== null) {
                const selected = currentQ.options[selectedOption];
                correct = selected.english === currentQ.english;
            } else if (gameMode === 'fill-in-the-blank') {
                const val = textInput.trim();
                correct = currentQ.chinese.some(c => val.includes(c) || c.includes(val));
            }
            
            setIsAnswered(true);
            setIsCorrect(correct);
            
            if (correct) {
              const newCombo = combo + 1;
              setCombo(newCombo);
              if (newCombo > maxComboSession) setMaxComboSession(newCombo);
              
              setScore(s => s + 1);
              setUserData(prev => ({
                ...prev,
                totalCorrect: prev.totalCorrect + 1,
                maxCombo: Math.max(prev.maxCombo, newCombo)
              }));
              
              setFeedbackMessage("Target Acquired.");
              
              const particleCount = 30 + (newCombo * 5); 
              window.confetti({
                  particleCount: Math.min(particleCount, 100),
                  spread: 60,
                  origin: { y: 0.7 },
                  colors: ['#22d3ee', '#e879f9']
              });
            } else {
              setCombo(0);
              setShake(true);
              setTimeout(() => setShake(false), 500);
              setFeedbackMessage(`Missed. Meaning: ${currentQ.chinese.join(' / ')}`);
            }
          };

          const nextQuestion = () => {
            if (currentQIndex < quizQuestions.length - 1) {
              setCurrentQIndex(prev => prev + 1);
              setIsAnswered(false);
              setSelectedOption(null);
              setTextInput('');
              setFeedbackMessage('');
            } else {
              finishQuiz();
            }
          };

          const finishQuiz = () => {
            const isPerfect = score === quizQuestions.length;
            setUserData(prev => {
                const newCompleted = prev.quizzesCompleted + 1;
                const newPlayed = prev.playedBanks.includes(currentBankId) ? prev.playedBanks : [...prev.playedBanks, currentBankId];
                const newPerfect = (isPerfect && !prev.perfectBanks.includes(currentBankId))
                    ? [...prev.perfectBanks, currentBankId] 
                    : prev.perfectBanks;
                
                const newUnlock = [...prev.unlockedAchievements];
                const tempUserData = { ...prev, quizzesCompleted: newCompleted, playedBanks: newPlayed, perfectBanks: newPerfect };
                
                ACHIEVEMENTS.forEach(ach => {
                    if (!newUnlock.includes(ach.id)) {
                        if (ach.check(tempUserData) >= ach.maxProgress) {
                            newUnlock.push(ach.id);
                        }
                    }
                });

                return { ...prev, quizzesCompleted: newCompleted, playedBanks: newPlayed, perfectBanks: newPerfect, unlockedAchievements: newUnlock };
            });

            if (isPerfect) {
                window.confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, colors: ['#facc15', '#22d3ee'] });
            }
            setAppState('results');
          };

          const speakWord = (text) => {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            speechSynthesis.speak(u);
          };

          const getIconComponent = (iconName) => {
              const Map = {
                  'Briefcase': Icons.Briefcase,
                  'MessageSquare': Icons.MessageSquare,
                  'Globe': Icons.Globe,
                  'Users': Icons.Users,
                  'Rocket': Icons.Rocket,
                  'Cpu': Icons.Cpu
              };
              const Component = Map[iconName] || Icons.Cpu;
              return <Component />;
          };

          // --- Renders ---
          const renderHome = () => (
            <motion.div 
              initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -20 }}
              className="p-6 flex flex-col h-full"
            >
              <header className="flex justify-between items-center mb-8 pt-2">
                <div>
                  <h1 className="text-4xl font-cyber font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 drop-shadow-[0_0_10px_rgba(6,182,212,0.5)]">
                    CYBER<span className="text-white">VOCAB</span>
                  </h1>
                  <p className="text-slate-400 font-mono-tech text-xs tracking-[0.2em] uppercase mt-1">Neural Language Interface v3.1</p>
                </div>
                <button onClick={() => setShowAchievements(true)} className="relative group">
                   <div className="absolute inset-0 bg-cyan-500 blur-lg opacity-20 group-hover:opacity-40 transition-opacity rounded-full"></div>
                   <div className="relative p-3 bg-slate-900 rounded-xl border border-slate-700 group-hover:border-cyan-400 transition-colors">
                        <Icons.Trophy className="w-6 h-6 text-yellow-400" />
                   </div>
                   {userData.unlockedAchievements.length > 0 && (
                       <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-[#050505]">
                           {userData.unlockedAchievements.length}
                       </span>
                   )}
                </button>
              </header>

              <div className="grid grid-cols-2 gap-4 overflow-y-auto pb-32 pr-1 custom-scrollbar">
                {Object.values(WORD_BANKS).map(bank => {
                    const isPerfect = userData.perfectBanks.includes(bank.id);
                    const isAll = bank.id === 'bank_all';
                    return (
                        <TechCard 
                            key={bank.id} 
                            onClick={() => handleBankClick(bank.id)}
                            className={`p-4 flex flex-col items-center justify-center gap-4 min-h-[150px] group ${isAll ? 'col-span-2 border-yellow-500/30 bg-yellow-950/10' : ''}`}
                        >
                            {isPerfect && (
                                <div className="absolute top-2 right-2 text-yellow-400 animate-pulse">
                                    <Icons.Crown size={18} fill="currentColor" className="opacity-80"/>
                                </div>
                            )}
                            <div className={`relative p-4 rounded-2xl ${isAll ? 'bg-yellow-500/10 text-yellow-400' : 'bg-cyan-500/10 text-cyan-400'} group-hover:scale-110 transition-transform duration-300`}>
                                <div className={`absolute inset-0 blur-md opacity-50 ${isAll ? 'bg-yellow-500' : 'bg-cyan-500'}`}></div>
                                <div className="relative z-10">
                                    {getIconComponent(bank.icon)}
                                </div>
                            </div>
                            <div className="text-center z-10">
                                <h3 className={`font-cyber font-bold text-sm tracking-wide ${isAll ? 'text-yellow-100' : 'text-slate-200 group-hover:text-white'}`}>
                                    {bank.title}
                                </h3>
                                <p className="text-[10px] text-slate-500 font-mono-tech mt-1">
                                    {isAll ? '30 MODULES' : '15 MODULES'}
                                </p>
                            </div>
                        </TechCard>
                    )
                })}
              </div>
            </motion.div>
          );

          const renderQuiz = () => {
            if (!quizQuestions[currentQIndex]) return null;
            const q = quizQuestions[currentQIndex];

            return (
              <motion.div 
                key={currentQIndex}
                initial={{ opacity: 0, x: 50 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -50 }}
                className={`flex flex-col h-full p-6 relative ${shake ? 'animate-shake' : ''}`}
              >
                {/* Top HUD */}
                <div className="flex flex-col gap-2 mb-6">
                    <div className="flex items-center justify-between">
                        <button onClick={() => setAppState('home')} className="text-slate-600 hover:text-red-400 transition-colors"><Icons.XCircle /></button>
                        <div className="flex flex-col items-end">
                            <span className="font-mono-tech text-xs text-slate-500">SCORE_LOG</span>
                            <span className="font-cyber text-cyan-400 font-bold text-xl">{score.toString().padStart(2, '0')}</span>
                        </div>
                    </div>
                    <ProgressBar current={currentQIndex + (isAnswered ? 1 : 0)} total={quizQuestions.length} />
                </div>

                {/* Combo Meter */}
                <AnimatePresence>
                    {combo > 1 && (
                        <motion.div 
                            initial={{ opacity: 0, scale: 0.5, y: 20 }}
                            animate={{ opacity: 1, scale: 1, y: 0 }}
                            exit={{ opacity: 0, scale: 0.5 }}
                            key="combo-meter"
                            className="absolute top-20 left-0 right-0 flex justify-center pointer-events-none z-0"
                        >
                            <div className="bg-gradient-to-r from-orange-600/20 to-red-600/20 border border-orange-500/50 px-6 py-2 rounded-full flex items-center gap-2 backdrop-blur-sm">
                                <Icons.Flame className="text-orange-500 animate-pulse" size={20} fill="currentColor" />
                                <span className="font-cyber font-bold text-orange-400 tracking-widest text-lg">COMBO x{combo}</span>
                            </div>
                        </motion.div>
                    )}
                </AnimatePresence>

                {/* Question Card */}
                <div className="flex-grow flex flex-col items-center justify-center mb-6 z-10 mt-6">
                    <div className="font-mono-tech text-[10px] text-cyan-300 uppercase tracking-[0.3em] mb-4 bg-cyan-950/50 px-3 py-1 rounded-sm border-l-2 border-cyan-500">
                        DATA_TYPE: {q.pos}
                    </div>
                    <h2 className="text-5xl md:text-7xl font-academic font-bold text-slate-100 mb-8 text-center drop-shadow-2xl">
                        {q.english}
                    </h2>
                    <TechButton variant="secondary" onClick={() => speakWord(q.english)} className="w-auto !py-2 !px-6 !rounded-full !bg-slate-800/50 !border-slate-700 hover:!border-cyan-500">
                        <Icons.Volume2 size={20} className="text-cyan-400"/>
                    </TechButton>
                </div>

                {/* Input Area */}
                <div className="flex-1 flex flex-col gap-3 overflow-y-auto pb-32 custom-scrollbar w-full">
                    {gameMode === 'multiple-choice' && q.options.map((opt, idx) => {
                        const isSelected = selectedOption === idx;
                        const showCorrect = isAnswered && opt.english === q.english;
                        const showWrong = isAnswered && isSelected && opt.english !== q.english;
                        const isDimmed = isAnswered && !showCorrect && !showWrong;

                        return (
                            <TechCard 
                                key={idx} 
                                onClick={() => handleOptionSelect(idx)}
                                isSelected={isSelected} isCorrect={showCorrect} isWrong={showWrong}
                                className={`p-5 text-center transition-all duration-200 ${isDimmed ? 'opacity-40 grayscale scale-95' : ''}`}
                            >
                                <span className={`text-lg md:text-xl font-bold ${showCorrect ? 'text-emerald-300' : showWrong ? 'text-red-300' : 'text-slate-200'}`}>
                                    {opt.chinese.join(' ')}
                                </span>
                            </TechCard>
                        );
                    })}

                    {gameMode === 'fill-in-the-blank' && (
                        <div className="w-full px-2">
                            <TechInput 
                                placeholder="請輸入中文意思..."
                                value={textInput}
                                onChange={(e) => setTextInput(e.target.value)}
                                disabled={isAnswered}
                                onKeyDown={(e) => {
                                   if (e.key === 'Enter' && !isAnswered && textInput.trim()) checkAnswer();
                                   if (e.key === 'Enter' && isAnswered) nextQuestion();
                                }}
                            />
                            <p className="text-center text-slate-500 text-xs mt-4 font-mono-tech uppercase tracking-widest">
                                ENTER CHINESE TRANSLATION
                            </p>
                        </div>
                    )}
                </div>

                {/* Bottom Action Bar */}
                <div className="fixed bottom-0 left-0 right-0 p-4 pb-8 bg-[#050505]/95 backdrop-blur-xl border-t border-slate-800 z-50 max-w-md mx-auto">
                    {!isAnswered ? (
                        <TechButton 
                            onClick={checkAnswer} 
                            disabled={gameMode === 'multiple-choice' ? selectedOption === null : !textInput.trim()}
                            className="shadow-cyan-900/20"
                        >
                            CONFIRM DATA
                        </TechButton>
                    ) : (
                        <motion.div initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }} className="flex flex-col gap-3">
                           <div className={`flex items-center justify-center gap-2 p-2 rounded-lg ${isCorrect ? 'bg-emerald-900/20' : 'bg-red-900/20'}`}>
                                {isCorrect ? <Icons.CheckCircle className="text-emerald-400" size={20}/> : <Icons.Zap className="text-red-400" size={20}/>}
                                <span className={`font-bold font-mono-tech text-sm ${isCorrect ? 'text-emerald-400' : 'text-red-400'}`}>{feedbackMessage}</span>
                           </div>
                           <TechButton variant={isCorrect ? 'success' : 'secondary'} onClick={nextQuestion}>
                               {currentQIndex < quizQuestions.length - 1 ? 'CONTINUE SEQUENCE' : 'FINALIZE'}
                           </TechButton>
                        </motion.div>
                    )}
                </div>
              </motion.div>
            );
          };

          const renderResults = () => (
            <motion.div 
              initial={{ scale: 0.95, opacity: 0 }} animate={{ scale: 1, opacity: 1 }}
              className="p-8 flex flex-col items-center justify-center h-full text-center relative overflow-hidden"
            >
                <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-64 h-64 bg-cyan-500/20 blur-[80px] rounded-full"></div>
                <div className="mb-8 relative z-10">
                    <motion.div 
                        animate={{ rotate: 360 }} 
                        transition={{ duration: 20, repeat: Infinity, ease: "linear" }}
                        className="absolute inset-0 border-2 border-dashed border-cyan-500/30 rounded-full"
                    ></motion.div>
                    <div className="bg-slate-900/80 p-6 rounded-full border border-cyan-500/50 shadow-[0_0_30px_rgba(6,182,212,0.3)]">
                        <Icons.Trophy size={64} className="text-yellow-400 drop-shadow-lg" />
                    </div>
                </div>
                <h2 className="text-3xl font-cyber font-bold text-white mb-2 tracking-wide">SYNC COMPLETE</h2>
                <p className="text-slate-400 font-mono-tech text-sm mb-8">Neural synchronization achieved.</p>

                <div className="grid grid-cols-2 gap-4 w-full mb-8">
                    <div className="bg-slate-900/60 border border-slate-700 p-4 rounded-2xl flex flex-col items-center">
                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">SCORE</span>
                        <span className="text-3xl font-mono-tech text-emerald-400 font-bold">{score} / {quizQuestions.length}</span>
                    </div>
                    <div className="bg-slate-900/60 border border-slate-700 p-4 rounded-2xl flex flex-col items-center">
                        <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">MAX COMBO</span>
                        <div className="flex items-center gap-1">
                            <Icons.Flame size={16} className="text-orange-500" fill="currentColor"/>
                            <span className="text-3xl font-mono-tech text-orange-400 font-bold">{maxComboSession}</span>
                        </div>
                    </div>
                </div>

                <div className="w-full space-y-3 z-10">
                    <TechButton onClick={() => startQuiz(currentBankId, gameMode)}>RE-INITIALIZE</TechButton>
                    <TechButton variant="secondary" onClick={() => setAppState('home')}>RETURN TO HUB</TechButton>
                </div>
            </motion.div>
          );

          return (
            <Layout>
              <AnimatePresence mode='wait'>
                {appState === 'home' && renderHome()}
                {appState === 'quiz' && !quizLoading && renderQuiz()}
                {appState === 'results' && renderResults()}
              </AnimatePresence>
              
              {quizLoading && (
                  <div className="absolute inset-0 z-50 bg-[#050505] flex flex-col items-center justify-center text-cyan-500">
                      <div className="relative">
                        <div className="absolute inset-0 bg-cyan-500 blur-xl opacity-20 animate-pulse"></div>
                        <Icons.BrainCircuit className="w-16 h-16 mb-6 relative z-10 animate-bounce" />
                      </div>
                      <p className="font-mono-tech tracking-[0.2em] text-sm animate-pulse">DECRYPTING LANGUAGE PACK...</p>
                  </div>
              )}

              {/* Mode Select Modal */}
              <AnimatePresence>
                {showModeSelect && (
                    <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <motion.div 
                            initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.9, opacity: 0 }}
                            className="bg-[#0a0f1c] border border-cyan-900/50 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative overflow-hidden"
                        >
                            <div className="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(#06b6d4_1px,transparent_1px)] [background-size:16px_16px]"></div>
                            <h3 className="text-xl font-cyber text-center text-white mb-6">SELECT PROTOCOL</h3>
                            <div className="space-y-4 relative z-10">
                                <button onClick={() => confirmStartQuiz('multiple-choice')} className="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 hover:border-cyan-400 hover:bg-slate-800 transition-all group flex items-center gap-4">
                                    <div className="p-3 rounded-lg bg-cyan-900/20 text-cyan-400 group-hover:bg-cyan-400 group-hover:text-black transition-colors"><Icons.MousePointerClick size={24} /></div>
                                    <div className="text-left"><div className="font-bold text-slate-200">STANDARD</div><div className="text-xs text-slate-500">Multiple Choice</div></div>
                                </button>
                                <button onClick={() => confirmStartQuiz('fill-in-the-blank')} className="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 hover:border-purple-400 hover:bg-slate-800 transition-all group flex items-center gap-4">
                                    <div className="p-3 rounded-lg bg-purple-900/20 text-purple-400 group-hover:bg-purple-400 group-hover:text-black transition-colors"><Icons.Keyboard size={24} /></div>
                                    <div className="text-left"><div className="font-bold text-slate-200">DECRYPTION</div><div className="text-xs text-slate-500">Type Chinese Meaning</div></div>
                                </button>
                            </div>
                            <button onClick={() => setShowModeSelect(false)} className="mt-6 w-full text-slate-500 text-xs font-mono-tech hover:text-white transition-colors">CANCEL</button>
                        </motion.div>
                    </div>
                )}
              </AnimatePresence>

              {/* Achievements Modal */}
              <AnimatePresence>
              {showAchievements && (
                <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                     <motion.div 
                        initial={{ y: 100, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 100, opacity: 0 }}
                        className="bg-[#0a0f1c] border border-cyan-900/50 w-full max-w-md rounded-2xl max-h-[85vh] overflow-hidden flex flex-col shadow-2xl"
                     >
                        <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-[#0f1a2e]">
                            <div className="flex items-center gap-2"><Icons.Trophy className="text-yellow-500" size={20} /><h3 className="font-cyber text-lg text-white tracking-wide">ACHIEVEMENTS</h3></div>
                            <button onClick={() => setShowAchievements(false)}><Icons.XCircle className="text-slate-400 hover:text-red-400 transition-colors" /></button>
                        </div>
                        <div className="p-4 overflow-y-auto flex-1 space-y-3 custom-scrollbar bg-[#050505]/50">
                            {ACHIEVEMENTS.map(ach => {
                                const currentProgress = ach.check(userData, 0);
                                const isUnlocked = userData.unlockedAchievements.includes(ach.id);
                                return (
                                    <div key={ach.id} className={`relative p-4 rounded-xl border overflow-hidden ${isUnlocked ? 'bg-slate-800/40 border-cyan-500/30' : 'bg-slate-900/20 border-slate-800'}`}>
                                        {isUnlocked && <div className="absolute inset-0 bg-gradient-to-r from-cyan-900/10 to-transparent pointer-events-none" />}
                                        <div className="flex items-start gap-4 relative z-10">
                                            <div className={`p-3 rounded-xl border ${isUnlocked ? 'bg-slate-900 border-cyan-500/50 text-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.2)]' : 'bg-slate-950 border-slate-800 text-slate-700'}`}>
                                                {ach.icon}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex justify-between items-start mb-1">
                                                    <h4 className={`font-bold truncate pr-2 ${isUnlocked ? 'text-cyan-50' : 'text-slate-500'}`}>{ach.title}</h4>
                                                    {isUnlocked ? <Icons.Unlock size={14} className="text-emerald-400 shrink-0 mt-1"/> : <Icons.Lock size={14} className="text-slate-700 shrink-0 mt-1" />}
                                                </div>
                                                <p className="text-xs text-slate-400 mb-3 leading-relaxed">{ach.desc}</p>
                                                <div className="flex items-center gap-3">
                                                    <div className="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                                        <div className={`h-full rounded-full ${isUnlocked ? 'bg-emerald-500' : 'bg-slate-600'}`} style={{ width: `${Math.min(100, (currentProgress / ach.maxProgress) * 100)}%` }} />
                                                    </div>
                                                    <span className="text-[10px] font-mono-tech text-slate-500">{Math.min(currentProgress, ach.maxProgress)}/{ach.maxProgress}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                     </motion.div>
                </div>
              )}
              </AnimatePresence>
            </Layout>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
